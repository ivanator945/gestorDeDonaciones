<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GestorDeDonaciones</title>
    <link rel="stylesheet" href="../css/basicoCss.css">
</head>

<body>

    <div id="contenedorPrincipal">

        <div id="zonaIzquierda">
            <h1>GestorDeDonaciones</h1>
            <div id="zonaPrincipal"></div>
        </div>

        <div id="zonaDerecha">
            <h2>Resumen de Donaciones</h2>
            <div id="listaResumen"></div>
        </div>
    </div>


    <div id="formularioDonacion">
        <h2>Datos del Donante</h2>
        <form id="donacionForm" novalidate>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required minlength="4" maxlength="15">

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" required>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required>

            <label>Método de Pago:</label>
            <div class="radio-group">
                <label><input type="radio" name="metodoPago" value="tarjeta" required> Tarjeta</label>
                <label><input type="radio" name="metodoPago" value="transferencia"> Transferencia</label>
            </div>

            <label>¿Es socio?</label>
            <div class="radio-group">
                <label><input type="radio" name="esSocio" value="si"> Sí</label>
                <label><input type="radio" name="esSocio" value="no" checked> No</label>
            </div>

            <div id="campoSocio" style="display:none;">
                <label for="codigoSocio">Código de Socio:</label>
                <input type="text" id="codigoSocio" pattern="[A-Za-z]{3}[0-9]{4}[/_.#&]" title="3 letras + 4 números + un símbolo (/_.#&)">
            </div>

            <div id="botonesForm">
                <button type="submit" id="btnRealizar">Realizar donación</button>
                <button type="button" id="btnLimpiar">Limpiar formulario</button>
            </div>
        </form>
    </div>

    <script src="../js/General.js"></script>
</body>

</html>
